<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
* {
  box-sizing: border-box;
}

.navbar {
  display: block;
  width: 100%;
  height: 80px;
  padding: 0 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 35px;
  font-weight:bolder;
}

.nav-links {
  display: block;
  list-style: disc;
  padding: 0;
  margin: 0;
  gap: 25px;
  display: flex;
}

.nav-links li {
  display: block;
  font-size: 22px;
}

.auth-buttons {
  display: block;
  gap: 10px;

}
button {
  padding: 10px 18px;
}
.btn{
    background-color: #4724FB;
}
.t{
    color:#AB9EEC ;
}
.tt:hover .dropdown{
display: block;
position: absolute;
border: 1px solid red;
padding-left: 0px;
}
.dropdown{
display: none;
position: relative;
}
    </style>
</head>
<body>
    <header class="navbar">
  <div class="logo">LOGO</div>

  <ul class="nav-links">
    <li>about</li>
    <li class="tt">solution 
        <ul class="dropdown">
            <li>solution 1</li>
              <li>solution 2</li>
              <li>solution 3</li>
                
        </ul>
    </li>
    <li class="t">Resources</li>
    <li>Pricing</li>
    <li>Contact</li>
  </ul>

  <div class="auth-buttons">
    <button>Login</button>
    <button class="btn">BUTTON</button>
  </div>
</header>
</body>
</html>
